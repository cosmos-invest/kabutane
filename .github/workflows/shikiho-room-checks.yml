name: Validate summer Shikiho room

on:
  pull_request:
    paths:
      - "shikiho-summer-2026.html"
      - "assets/shikiho-room.css"
      - "assets/shikiho-room.js"
      - "assets/site-upgrades.js"
      - "build_shikiho_room.py"
      - "build_shikiho_room_v2.py"
      - "data/curated/shikiho-2026-summer.json"
      - "data/curated/shikiho-2026-summer-performance.json"
      - "tests/test_shikiho_room.py"
      - "tests/test_shikiho_room_v2.py"
      - "sw.js"
      - ".github/workflows/update-daily.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/build-shikiho-preview.yml"
      - ".github/workflows/shikiho-room-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python calculations
        run: |
          python -m py_compile build_shikiho_room.py build_shikiho_room_v2.py tests/test_shikiho_room.py tests/test_shikiho_room_v2.py
          python -m unittest discover -s tests -p 'test_shikiho_room.py' -v
          python -m unittest discover -s tests -p 'test_shikiho_room_v2.py' -v
      - name: Build current 20-company preview data
        run: python build_shikiho_room_v2.py
      - name: Validate JavaScript
        run: |
          node --check assets/shikiho-room.js
          node --check assets/site-upgrades.js
          node --check sw.js
      - name: Validate page, fixed list and publishing
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          html = Path("shikiho-summer-2026.html").read_text(encoding="utf-8")
          css = Path("assets/shikiho-room.css").read_text(encoding="utf-8")
          js = Path("assets/shikiho-room.js").read_text(encoding="utf-8")
          manifest = json.loads(Path("data/curated/shikiho-2026-summer.json").read_text(encoding="utf-8"))
          performance = json.loads(Path("data/curated/shikiho-2026-summer-performance.json").read_text(encoding="utf-8"))
          update_daily = Path(".github/workflows/update-daily.yml").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          preview = Path(".github/workflows/build-shikiho-preview.yml").read_text(encoding="utf-8")
          sw = Path("sw.js").read_text(encoding="utf-8")
          Parser().feed(html)
          if css.count("{") != css.count("}"):
              raise SystemExit("Shikiho room CSS braces are not balanced")
          if manifest.get("expected_count") != 20 or len(manifest.get("stocks") or []) != 20:
              raise SystemExit("Summer Shikiho room must contain exactly 20 fixed stocks")
          counts = {tier: sum(1 for row in manifest["stocks"] if row.get("tier") == tier) for tier in ("S", "A", "B")}
          if counts != {"S": 5, "A": 5, "B": 10}:
              raise SystemExit(f"Tier counts are invalid: {counts}")
          if manifest.get("baseline_date") != "2026-06-18":
              raise SystemExit("Baseline date must stay fixed at 2026-06-18")
          if manifest.get("answer_target_date") != "2026-08-31":
              raise SystemExit("Answer date must stay fixed at 2026-08-31")
          for marker in (
              "四季報観察室｜2026年夏号",
              "合言葉はこの記事に書いてあるよ",
              "n07501f295da0",
              "2026-06-18",
              "半角英数字",
              "shikiho-room.js",
              "shikiho-room.css",
          ):
              if marker not in html:
                  raise SystemExit(f"Page marker missing: {marker}")
          for forbidden in ("プリクラ", "cosmos_summer"):
              if forbidden in js or forbidden in html:
                  raise SystemExit("Plain passphrase must not be embedded in the login source")
          access = manifest.get("access") or {}
          if set(access) & {"passphrase", "password", "plain_text"}:
              raise SystemExit("Manifest must store only the passphrase hash")
          if len(str(access.get("sha256") or "")) != 64:
              raise SystemExit("Passphrase SHA-256 hash is missing")
          if performance.get("record_count") != 20 or performance.get("complete_count", 0) < 18:
              raise SystemExit(f"Preview data is incomplete: {performance.get('complete_count')}/20")
          suspicious = [row for row in performance.get("records", []) if row.get("return_pct") is not None and abs(float(row["return_pct"])) >= 200]
          if suspicious:
              raise SystemExit(f"Suspicious split-adjusted returns remain: {[(r.get('code'), r.get('return_pct')) for r in suspicious]}")
          for marker in ("python build_shikiho_room_v2.py", "shikiho-2026-summer-performance.json", "shikiho-summer-2026.html"):
              if marker not in update_daily:
                  raise SystemExit(f"Daily workflow marker missing: {marker}")
          if "python build_shikiho_room_v2.py" not in preview:
              raise SystemExit("Preview workflow must use the split-safe builder")
          for marker in ("shikiho-summer-2026.html", "assets/shikiho-room.css", "data/curated/shikiho-2026-summer.json"):
              if marker not in deploy:
                  raise SystemExit(f"Pages deployment marker missing: {marker}")
          for marker in ('"./shikiho-summer-2026.html"', '"./assets/shikiho-room.js"', '"./data/curated/shikiho-2026-summer.json"'):
              if marker not in sw:
                  raise SystemExit(f"PWA cache marker missing: {marker}")
          print("Summer Shikiho room validation passed")
          PY
