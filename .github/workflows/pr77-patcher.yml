name: Apply reviewed PR77 split fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr77-patcher
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.issue.pull_request && github.event.issue.number == 77 && contains(github.event.comment.body, '/apply-pr77-split')
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 77 --repo "$GITHUB_REPOSITORY" --body 'PR77 patcher: started'

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/watchlist-premium-research
          fetch-depth: 0

      - name: Checkout patch source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          fetch-depth: 0

      - name: Apply and validate reviewed patch
        id: apply
        shell: bash
        run: |
          set +e
          {
            git apply --check _main/.github/pr77-split.patch
            git apply _main/.github/pr77-split.patch
            python3 -m py_compile scripts/build_core_universe_data.py scripts/premium_research.py tests/test_premium_research.py
            python3 -m unittest tests.test_premium_research tests.test_logic -v
            git diff --check
          } > /tmp/pr77-patcher.log 2>&1
          rc=$?
          cat /tmp/pr77-patcher.log
          if [ "$rc" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi

      - name: Report validation failure
        if: failure() && steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tail -80 /tmp/pr77-patcher.log > /tmp/pr77-tail.log || true
          printf 'PR77 patcher: validation failed\n```text\n%s\n```\n' "$(cat /tmp/pr77-tail.log)" > /tmp/pr77-comment.md
          gh pr comment 77 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr77-comment.md

      - name: Push corrected PR branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show origin/main:.github/workflows/update-margin-balance.yml > .github/workflows/update-margin-balance.yml
          rm -f .github/workflows/apply-pr77-split-fix.yml
          git add learn.html scripts/build_core_universe_data.py scripts/premium_research.py tests/test_premium_research.py .github/workflows/update-margin-balance.yml
          git add -u .github/workflows/apply-pr77-split-fix.yml || true
          git commit -m 'fix: normalize premium outcomes across stock splits'
          git push origin HEAD:feature/watchlist-premium-research

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 77 --repo "$GITHUB_REPOSITORY" --body 'PR77 patcher: split normalization applied and targeted tests passed.'

      - name: Remove temporary patch infrastructure
        if: success()
        shell: bash
        run: |
          cd _main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm -f .github/workflows/pr77-patcher.yml .github/pr77-split.patch
          git add -u .github/workflows/pr77-patcher.yml .github/pr77-split.patch
          git commit -m 'chore: remove PR77 patch infrastructure'
          git push origin main
