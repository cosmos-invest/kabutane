name: Update daily candidate prices

on:
  workflow_dispatch:
  schedule:
    # 平日21:00 JST。市場終了後だけ本番データを更新する。
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate updater
        run: |
          python -m py_compile update_daily.py provisional_signal.py build_market_reports.py build_daily_snapshot.py build_daily_events.py build_shikiho_room.py build_shikiho_room_v2.py validate_data_contract.py validate_daily_derived_contract.py scripts/public_core_radar.py scripts/update_etf_pcf.py scripts/validate_market_freshness.py tests/test_update_daily.py tests/test_provisional_signal.py tests/test_market_reports.py tests/test_daily_snapshot.py tests/test_daily_events.py tests/test_shikiho_room.py tests/test_shikiho_room_v2.py tests/test_data_contract.py tests/test_daily_derived_contract.py tests/test_today_page.py tests/test_etf_pcf.py tests/test_market_freshness.py
          python -m unittest discover -s tests -p 'test_update_daily.py' -v
          python -m unittest discover -s tests -p 'test_provisional_signal.py' -v
          python -m unittest discover -s tests -p 'test_market_reports.py' -v
          python -m unittest discover -s tests -p 'test_daily_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_daily_events.py' -v
          python -m unittest discover -s tests -p 'test_shikiho_room.py' -v
          python -m unittest discover -s tests -p 'test_data_contract.py' -v
          python -m unittest discover -s tests -p 'test_daily_derived_contract.py' -v
          python -m unittest discover -s tests -p 'test_today_page.py' -v
          python -m unittest discover -s tests -p 'test_etf_pcf.py' -v
          python -m unittest discover -s tests -p 'test_market_freshness.py' -v
          node --check assets/today-kabutane.js
          node --check assets/all-stocks.js
          node --check assets/core-detail-fallback.js
          node --check assets/premium-etf-pcf.js

      - name: Preserve previous daily date
        run: cp data/daily-update-status.json /tmp/daily-status-before.json

      - name: Download incremental daily prices
        env:
          DAILY_YF_BATCH_SIZE: "80"
          DAILY_DOWNLOAD_PERIOD: "1mo"
        run: |
          python update_daily.py
          python provisional_signal.py
          python build_market_reports.py
          python build_shikiho_room_v2.py
          python -m scripts.update_etf_pcf

      - name: Reject date regression
        run: python scripts/validate_market_freshness.py --daily-only --baseline-daily /tmp/daily-status-before.json

      - name: Validate generated data contract
        run: python validate_data_contract.py

      - name: Build compact daily snapshot and events
        run: |
          python build_daily_snapshot.py
          python build_daily_events.py
          python validate_daily_derived_contract.py

      - name: Commit daily overlays and observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/daily data/daily-update-status.json data/ranking.json data/daily-change.json data/monthly-report.json data/daily-snapshot.json data/daily-events.json data/premium/etf-pcf history/daily history/daily-events data/curated/shikiho-2026-summer-performance.json result.csv
          if git diff --cached --quiet; then
            echo "No daily price changes"
            exit 0
          fi
          git commit -m "chore: update daily prices, rankings and Shikiho room"
          git pull --rebase origin main
          git push origin main
