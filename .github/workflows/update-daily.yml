name: Update daily candidate prices

on:
  workflow_dispatch:
  schedule:
    # 平日21:00 JST。GitHub Actionsの混雑時は開始が遅れる場合があります。
    - cron: "0 12 * * 1-5"
  push:
    branches: ["main"]
    paths:
      - "update_daily.py"
      - "provisional_signal.py"
      - "build_market_reports.py"
      - "tests/test_update_daily.py"
      - "tests/test_provisional_signal.py"
      - "tests/test_market_reports.py"
      - ".github/workflows/update-daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# 月次・日次・銘柄マスター更新を直列化し、同じデータへの同時pushを防ぐ。
concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate updater
        run: |
          python -m py_compile update_daily.py provisional_signal.py build_market_reports.py tests/test_update_daily.py tests/test_provisional_signal.py tests/test_market_reports.py
          python -m unittest discover -s tests -p 'test_update_daily.py' -v
          python -m unittest discover -s tests -p 'test_provisional_signal.py' -v
          python -m unittest discover -s tests -p 'test_market_reports.py' -v

      - name: Download incremental daily prices
        env:
          DAILY_YF_BATCH_SIZE: "80"
          DAILY_DOWNLOAD_PERIOD: "1mo"
        run: |
          python update_daily.py
          python provisional_signal.py
          python build_market_reports.py

      - name: Commit daily overlays and observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/daily data/daily-update-status.json data/ranking.json data/daily-change.json data/monthly-report.json result.csv
          if git diff --cached --quiet; then
            echo "No daily price changes"
          else
            git commit -m "chore: update daily prices, provisional signals and observation ranking"
            git push origin main
          fi

      - name: Prepare current data for GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp \
            index.html detail.html backtest.html replay.html howto.html learn.html signal-method.html \
            ranking.html monthly-report.html monthly-strategy.html history.html \
            manifest.webmanifest sw.js .nojekyll result.csv out.csv \
            _site/
          cp -R assets data history ranking monthly-report _site/
          test -f _site/data/latest.json
          test -f _site/data/daily-update-status.json
          test -f _site/data/ranking.json
          test -f _site/data/daily-change.json
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path('_site/data/latest.json').read_text(encoding='utf-8'))
          daily = json.loads(Path('_site/data/daily-update-status.json').read_text(encoding='utf-8'))
          ranking = json.loads(Path('_site/data/ranking.json').read_text(encoding='utf-8'))
          if daily.get('price_date') != ranking.get('price_date'):
              raise SystemExit(f"Daily/ranking date mismatch: {daily.get('price_date')} != {ranking.get('price_date')}")
          if latest.get('daily_price_date') not in (None, daily.get('price_date')):
              raise SystemExit(f"Latest/daily date mismatch: {latest.get('daily_price_date')} != {daily.get('price_date')}")
          print(f"Publishing daily price date: {daily.get('price_date')}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy current daily data to Pages
        id: deployment
        uses: actions/deploy-pages@v4
