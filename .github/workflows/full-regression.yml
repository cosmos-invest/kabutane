name: Full site regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 4173 >/tmp/kabutane-full-regression.log 2>&1 &
          echo $! > /tmp/kabutane-full-regression.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kabutane-full-regression.log
          exit 1

      - name: Run desktop and Android regression
        run: npx playwright test tests/full-regression.spec.js --reporter=line --trace=retain-on-failure

      - name: Upload regression traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-failure
          path: test-results/
          if-no-files-found: ignore
