name: Update premium engine research

on:
  pull_request:
    paths:
      - 'scripts/build_premium_lab.py'
      - 'scripts/premium_research.py'
      - 'assets/premium-research.js'
      - 'assets/premium-research.css'
      - 'premium-supply-beta.html'
      - 'tests/test_premium_lab.py'
      - 'tests/test_premium_research.py'
      - '.github/workflows/update-premium-research.yml'
  workflow_run:
    workflows: ["Update core universe data", "Update JPX margin balance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-research-writes
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate premium engine research
        run: |
          python -m py_compile scripts/build_premium_lab.py scripts/premium_research.py tests/test_premium_lab.py tests/test_premium_research.py
          python -m unittest tests.test_premium_lab tests.test_premium_research -v
          node --check assets/premium-research.js
          grep -q '観察優先度の検証室' premium-supply-beta.html

  apply-reviewed-split-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 77
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/watchlist-premium-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stock split normalization and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/build_core_universe_data.py',
              '            result.append({"date": date.strftime("%Y-%m-%d"), "type": "SPLIT", "label": "株式分割・併合", "detail": f"比率 {split:g}"})',
              '            result.append({"date": date.strftime("%Y-%m-%d"), "type": "SPLIT", "label": "株式分割・併合", "detail": f"比率 {split:g}", "ratio": split})',
          )
          replace_once(
              'scripts/build_core_universe_data.py',
              '''            "daily": compact_daily_rows(daily, OVERLAY_DAYS),
            "technical": technical,
            "provisional_signal": signal,
        }''',
              '''            "daily": compact_daily_rows(daily, OVERLAY_DAYS),
            "technical": technical,
            "provisional_signal": signal,
            "corporate_events": corporate_events(daily.tail(OVERLAY_DAYS)),
        }''',
          )

          replace_once(
              'scripts/premium_research.py',
              '''    return result


