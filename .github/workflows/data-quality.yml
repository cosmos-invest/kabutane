name: Audit data quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "diagnose_errors.py"
      - ".github/workflows/data-quality.yml"
  push:
    branches: ["main"]
    paths:
      - "diagnose_errors.py"
      - ".github/workflows/data-quality.yml"
  workflow_run:
    workflows: ["Update monthly RSI data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: audit-data-quality
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.head_ref || github.ref_name }}

      - name: Build quality report
        run: |
          python -m py_compile diagnose_errors.py
          python diagnose_errors.py

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/quality-report.json").read_text(encoding="utf-8"))
          required = {"raw_error_count", "unique_error_tickers", "active_zero_fundamentals"}
          missing = required - set(report.get("summary", {}))
          if missing:
              raise SystemExit(f"missing report fields: {sorted(missing)}")
          print(report["summary"])
          PY

      - name: Commit current report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DATA_QUALITY.md data/quality-report.json
          if git diff --cached --quiet; then
            echo "No quality report changes"
          else
            git commit -m "chore: update data quality report"
            git push origin HEAD:main
          fi
