name: Update core universe data

on:
  pull_request:
    paths:
      - 'dividend_history.py'
      - 'scripts/build_core_universe_data.py'
      - 'scripts/build_core_with_dividends.py'
      - 'scripts/build_premium_lab.py'
      - 'scripts/public_core_radar.py'
      - 'scripts/validate_market_freshness.py'
      - 'tests/test_core_universe_data.py'
      - 'tests/test_dividend_history.py'
      - 'tests/test_premium_lab.py'
      - 'tests/test_public_core_radar.py'
      - 'tests/test_market_freshness.py'
      - '.github/workflows/update-core-universe-data.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-core-universe-data.yml'
  workflow_run:
    workflows: ["Update daily candidate prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-universe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and syntax checks
        run: |
          python -m py_compile dividend_history.py scripts/build_core_universe_data.py scripts/build_core_with_dividends.py scripts/build_premium_lab.py scripts/public_core_radar.py scripts/validate_market_freshness.py tests/test_core_universe_data.py tests/test_dividend_history.py tests/test_premium_lab.py tests/test_public_core_radar.py tests/test_market_freshness.py
          python -m unittest tests.test_core_universe_data tests.test_dividend_history tests.test_premium_lab tests.test_public_core_radar tests.test_market_freshness -v
          node --check assets/core-detail-fallback.js
          node --check assets/premium-supply-beta.js
          node --check assets/detail-dividends.js
          node --check assets/all-stocks.js
          node tests/test_core_detail_fallback.js
          grep -q 'core-detail-fallback.js' detail.html
          grep -q 'detail-dividends.js' detail.html
          grep -q '暫定GC' premium-supply-beta.html
          ! grep -q 'extended' premium-supply-beta.html
      - name: Validate public catalog against checked-in full universe
        run: |
          python -m scripts.public_core_radar --input data/core/radar.json --output /tmp/public-radar.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/public-radar.json').read_text(encoding='utf-8'))
          rows = payload.get('records') or []
          if len(rows) < 3500:
              raise SystemExit(f'public catalog too small: {len(rows)}')
          if any(str(row.get('provisional_status') or '').upper() == 'GC' for row in rows):
              raise SystemExit('public all-stock catalog leaked provisional GC')
          if any('monthly_rsi_spread' in row for row in rows):
              raise SystemExit('public all-stock catalog leaked current-month RSI spread')
          print('public catalog records', len(rows))
          PY

  live-sample:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build live sample including note 5243
        run: |
          python -m scripts.build_core_with_dividends --codes 5243,5942 --output /tmp/kabutane-core-sample --refresh-base --fundamentals-limit 0
          python -m scripts.public_core_radar --input /tmp/kabutane-core-sample/radar.json --output /tmp/kabutane-core-sample/public-radar.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/kabutane-core-sample')
          radar = json.loads((root/'radar.json').read_text(encoding='utf-8'))
          public = json.loads((root/'public-radar.json').read_text(encoding='utf-8'))
          codes = {str(row.get('code')) for row in radar.get('records') or []}
          if '5243' not in codes:
              raise SystemExit('5243 note is missing from the core live sample')
          if int(radar.get('daily_coverage') or 0) < 1 or int(radar.get('monthly_coverage') or 0) < 1:
              raise SystemExit(f"sample coverage too low: {radar.get('daily_coverage')} / {radar.get('monthly_coverage')}")
          shard = json.loads((root/'charts'/'52.json').read_text(encoding='utf-8'))
          if '5243' not in shard.get('records', {}):
              raise SystemExit('5243 chart payload not generated')
          dividend_shard = json.loads((root/'dividends'/'52.json').read_text(encoding='utf-8'))
          if '5243' not in dividend_shard.get('records', {}):
              raise SystemExit('5243 dividend history not generated')
          public_5243 = next((row for row in public.get('records') or [] if str(row.get('code')) == '5243'), None)
          if public_5243 is None or 'consecutive_dividend_increase_years' not in public_5243:
              raise SystemExit('public sample is missing dividend screening fields')
          if any(str(row.get('provisional_status') or '') == 'GC' for row in public.get('records') or []):
              raise SystemExit('public sample leaked provisional GC in all-stock catalog')
          if any('monthly_rsi_spread' in row for row in public.get('records') or []):
              raise SystemExit('public sample leaked current-month RSI spread in all-stock catalog')
          print('core live sample with dividend history OK')
          PY

  detect-heavy-change:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(scripts/build_core_universe_data\.py|update_universe\.py|requirements\.txt|stocks\.csv|stocks-all\.csv)$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  full-footprint:
    needs: [validate, detect-heavy-change]
    if: github.event_name == 'pull_request' && needs.detect-heavy-change.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Measure all-core price coverage and static footprint
        env:
          CORE_BASE_MAX_BYTES: '94371840'
        run: |
          python -m scripts.build_core_universe_data --output /tmp/kabutane-core-full --refresh-base --fundamentals-limit 0
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/kabutane-core-full')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          total = int(manifest.get('core_count') or 0)
          daily = int(manifest.get('daily_coverage') or 0)
          monthly = int(manifest.get('monthly_coverage') or 0)
          base = int((manifest.get('bytes') or {}).get('chart_base') or 0)
          if total < 3500:
              raise SystemExit(f'core count too low: {total}')
          if daily / total < .90 or monthly / total < .90:
              raise SystemExit(f'coverage too low: daily={daily}/{total}, monthly={monthly}/{total}')
          if base > 90 * 1024 * 1024:
              raise SystemExit(f'chart footprint too large: {base}')
          print('core', total, 'daily', daily, 'monthly', monthly, 'chart_base_bytes', base)
          PY

  update:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: market-data-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preserve previous core date
        run: cp data/core/radar.json /tmp/core-radar-before.json
      - name: Refresh core catalog
        run: python update_universe.py
      - name: Build all-core radar, chart data and finance cache
        shell: bash
        env:
          # Dividend history is derived from the monthly Yahoo frames. Refreshing
          # only the daily overlay leaves CAPTURED_MONTHLY empty, so force the
          # monthly/base download until dividend history has been published.
          FORCE_DIVIDEND_BASE_REFRESH: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          REFRESH=""
          FUND_LIMIT=600
          CURRENT_UNIVERSE_HASH="$(sha256sum stocks.csv | awk '{print $1}')"
          STORED_UNIVERSE_HASH="$(cat data/core/universe.sha256 2>/dev/null || true)"
          DIVIDEND_COVERAGE="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              manifest = json.loads(Path('data/core/manifest.json').read_text(encoding='utf-8'))
              print(int(manifest.get('dividend_history_coverage') or 0))
          except Exception:
              print(0)
          PY
          )"
          if [ "$FORCE_DIVIDEND_BASE_REFRESH" = "1" ] || [ "$DIVIDEND_COVERAGE" -le 0 ]; then
            echo "Dividend history is missing; refreshing monthly chart base."
            REFRESH="--refresh-base"
            FUND_LIMIT=1200
          elif [ ! -f data/core/manifest.json ]; then
            REFRESH="--refresh-base"
            FUND_LIMIT=1200
          elif [ "$CURRENT_UNIVERSE_HASH" != "$STORED_UNIVERSE_HASH" ]; then
            echo "Core universe changed; refreshing chart base."
            REFRESH="--refresh-base"
          elif [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%d)" -le 7 ]; then
            REFRESH="--refresh-base"
          fi
          python -m scripts.build_core_with_dividends $REFRESH --fundamentals-limit "$FUND_LIMIT"
          printf '%s\n' "$CURRENT_UNIVERSE_HASH" > data/core/universe.sha256
      - name: Rebuild premium opportunity radar and public catalog
        run: |
          python scripts/build_supply_demand_screen.py
          python -m scripts.build_premium_lab
          python -m scripts.public_core_radar
      - name: Validate production coverage and freshness
        run: |
          python scripts/validate_market_freshness.py --baseline-core /tmp/core-radar-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/core/manifest.json').read_text(encoding='utf-8'))
          radar = json.loads(Path('data/core/radar.json').read_text(encoding='utf-8'))
          public = json.loads(Path('data/core/public-radar.json').read_text(encoding='utf-8'))
          premium = json.loads(Path('data/premium/opportunity-radar.json').read_text(encoding='utf-8'))
          total = int(manifest.get('core_count') or 0)
          if total < 3500:
              raise SystemExit(f'core count too low: {total}')
          if len(radar.get('records') or []) != total:
              raise SystemExit('core radar record count mismatch')
          if len(public.get('records') or []) != total:
              raise SystemExit('public radar record count mismatch')
          if any(str(row.get('provisional_status') or '') == 'GC' for row in public.get('records') or []):
              raise SystemExit('public all-stock catalog leaked provisional GC')
          if any('monthly_rsi_spread' in row for row in public.get('records') or []):
              raise SystemExit('public all-stock catalog leaked current-month RSI spread')
          if len(premium.get('records') or []) != total:
              raise SystemExit('premium radar must contain the full core universe')
          if int(manifest.get('daily_coverage') or 0) / total < .90:
              raise SystemExit('daily coverage below 90%')
          if int(manifest.get('dividend_history_coverage') or 0) <= 0:
              raise SystemExit('dividend history coverage is empty')
          if not Path('data/core/universe.sha256').read_text(encoding='utf-8').strip():
              raise SystemExit('core universe fingerprint is missing')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          print('premium status', premium.get('status_counts'))
          print('public status', public.get('status_counts'))
          PY
      - name: Commit refreshed all-core data
        run: |
          if git diff --quiet -- stocks.csv stocks-all.csv data/universe-all.json data/universe-status.json data/core data/premium data/fundamentals_cache.json && [ -z "$(git ls-files --others --exclude-standard data/core data/premium)" ]; then
            echo "No core-universe changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.csv stocks-all.csv data/universe-all.json data/universe-status.json data/core data/premium/opportunity-radar.json data/premium/supply-demand-screen.json data/fundamentals_cache.json
          git commit -m "data: refresh all-core charts, provisional signals, dividends and premium radar"
          git pull --rebase origin main
          git push origin main
