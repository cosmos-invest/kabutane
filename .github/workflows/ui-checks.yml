name: Validate site UI

on:
  pull_request:
    paths:
      - "index.html"
      - "backtest.html"
      - "replay.html"
      - "detail.html"
      - "howto.html"
      - "learn.html"
      - "signal-method.html"
      - "ranking.html"
      - "monthly-report.html"
      - "monthly-strategy.html"
      - "history.html"
      - "ranking/**"
      - "monthly-report/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "update_daily.py"
      - "update_universe.py"
      - "retry_incomplete.py"
      - "generate_tradingview.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python signal and update engines
        run: |
          python -m py_compile tradingview_signal.py generate_tradingview.py update_daily.py update_universe.py retry_incomplete.py provisional_signal.py build_market_reports.py
          python -m unittest discover -s tests -p 'test_tradingview_signal.py' -v
          python -m unittest discover -s tests -p 'test_update_daily.py' -v
          python -m unittest discover -s tests -p 'test_update_universe.py' -v
          python -m unittest discover -s tests -p 'test_provisional_signal.py' -v
          python -m unittest discover -s tests -p 'test_build_market_reports.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check assets/backtest.js
          node --check assets/backtest-benchmark-status.js
          node --check assets/replay-core-v2.js
          node --check assets/replay-guided-core.js
          node --check assets/replay-guided-mode.js
          node --check assets/replay-guided-fixes.js
          node --check assets/replay-risk-ladder.js
          node --check assets/replay-ui-base-v2.js
          node --check assets/replay-charts-v2.js
          node --check assets/replay-render-v2.js
          node --check assets/replay-orders-basic-v2.js
          node --check assets/replay-orders-auto-v2.js
          node --check assets/replay-session-v2.js
          node --check assets/replay-workspace.js
          node --check assets/replay-unified-workspace.js
          node --check assets/replay-share-report-core.js
          node --check assets/replay-share-report.js
          node --check assets/replay-picker.js
          node --check assets/replay-month-end.js
          node --check assets/daily-overlay.js
          node --check assets/detail-enhancements.js
          node --check assets/detail-chart-viewport-core.js
          node --check assets/detail-chart-viewport.js
          node --check assets/detail-signal-status.js
          node --check assets/detail-signal-chart-fix.js
          node --check assets/provisional-monthly-rsi-core.js
          node --check assets/simple-analysis-cosmos.js
          node --check assets/kabutane-screening.js
          node --check assets/signal-v2.js
          node --check assets/site-upgrades.js
          node --check assets/copy-audit.js
          node --check assets/market-pages.js
          node --check assets/practice-history-core.js
          node --check assets/practice-history.js
          node --check assets/practice-history-page.js
          node --check assets/pwa-register.js
          node --check assets/characters.js
          node --check assets/kabutane-world.js
          node --check sw.js

      - name: Test JavaScript engines
        run: |
          node tests/test_backtest_engine.js
          node tests/test_replay_v2.js
          node tests/test_replay_risk_ladder.js
          node tests/test_replay_month_end.js
          node tests/test_replay_guided_core.js
          node tests/test_replay_share_report_core.js
          node tests/test_practice_history_core.js
          node tests/test_detail_enhancements.js
          node tests/test_detail_chart_viewport.js
          node tests/test_daily_overlay.js
          node tests/test_provisional_monthly_rsi_core.js
          node tests/test_signal_v2.js

      - name: Validate HTML CSS and manifest
        run: |
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for name in (
              "index.html", "backtest.html", "replay.html", "detail.html", "howto.html", "learn.html",
              "signal-method.html", "ranking.html", "monthly-report.html", "monthly-strategy.html", "history.html",
              "ranking/index.html", "monthly-report/index.html",
          ):
              Parser().feed(Path(name).read_text(encoding="utf-8"))

          for name in (
              "assets/backtest.css", "assets/replay.css", "assets/replay-v2.css",
              "assets/replay-workspace.css", "assets/replay-unified.css", "assets/replay-guided-mode.css",
              "assets/replay-share-report.css", "assets/detail-enhancements.css", "assets/detail-signal-status.css",
              "assets/detail-chart-viewport.css", "assets/simple-analysis-cosmos.css", "assets/kabutane.css",
              "assets/kabutane-characters.css", "assets/kabutane-links.css", "assets/market-insights.css",
              "assets/monthly-report.css", "assets/monthly-strategy-v16.css", "assets/kabutane-world.css",
          ):
              css = Path(name).read_text(encoding="utf-8")
              if css.count("{") != css.count("}"):
                  raise SystemExit(f"CSS braces are not balanced: {name}")

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          for key in ("name", "short_name", "start_url", "display", "icons"):
              if not manifest.get(key):
                  raise SystemExit(f"PWA manifest missing: {key}")
          print("HTML/CSS/PWA validation passed")
          PY

      - name: Audit public page structure
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          detail = Path("detail.html").read_text(encoding="utf-8")
          replay = Path("replay.html").read_text(encoding="utf-8")
          howto = Path("howto.html").read_text(encoding="utf-8")
          learn = Path("learn.html").read_text(encoding="utf-8")
          method = Path("signal-method.html").read_text(encoding="utf-8")
          monthly_redirect = Path("monthly-report.html").read_text(encoding="utf-8")
          monthly_strategy = Path("monthly-strategy.html").read_text(encoding="utf-8")
          pwa = Path("assets/pwa-register.js").read_text(encoding="utf-8")
          upgrades = Path("assets/site-upgrades.js").read_text(encoding="utf-8")
          copy_audit = Path("assets/copy-audit.js").read_text(encoding="utf-8")
          market_pages = Path("assets/market-pages.js").read_text(encoding="utf-8")
          service_worker = Path("sw.js").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")
          daily_workflow = Path(".github/workflows/update-daily.yml").read_text(encoding="utf-8")

          for marker in ("かぶたね", "cosmos-hero.webp", "homePracticeLink", "note.com/cosmos_invest"):
              if marker not in index:
                  raise SystemExit(f"Index is missing: {marker}")
          for marker in (
              "assets/provisional-monthly-rsi-core.js", "assets/detail-signal-status.js",
              "assets/detail-signal-chart-fix.js", "assets/detail-signal-status.css",
              "実線は月末確定値", "縦の緑線は確定GC",
          ):
              if marker not in detail:
                  raise SystemExit(f"Confirmed/provisional detail signal is missing: {marker}")
          for marker in ("assets/detail-chart-viewport-core.js", "assets/detail-chart-viewport.js", "assets/detail-chart-viewport.css"):
              if marker not in detail:
                  raise SystemExit(f"Interactive detail chart is missing: {marker}")
          for marker in ("assets/replay-guided-mode.js", "assets/replay-share-report.js"):
              if marker not in replay:
                  raise SystemExit(f"Replay feature is missing: {marker}")
          for marker in ("site-upgrades.js", "copy-audit.js", "practice-history-core.js", "practice-history.js"):
              if marker not in pwa:
                  raise SystemExit(f"PWA bootstrap is missing: {marker}")
          for marker in ("6項目", "今回の学び", "TOPIX代替ベンチマーク", "判定月NEW", "暫定GC・暫定DC"):
              if marker not in copy_audit:
                  raise SystemExit(f"Beginner-facing wording audit is missing: {marker}")
          if "実際のお金を動かす前の5項目" not in howto:
              raise SystemExit("How-to source changed; update the copy audit or the source heading together")
          for marker in ("確定シグナルと暫定シグナル", "TradingViewでDCなのに"):
              if marker not in learn:
                  raise SystemExit(f"FAQ signal clarification is missing: {marker}")
          for marker in ("進行中月の暫定値", "ランキング、月初レポート、確定ステータス"):
              if marker not in method:
                  raise SystemExit(f"Signal method clarification is missing: {marker}")
          for marker in ("note.com/qa/cosmos_invest", "この銘柄が表示された理由", 'href="ranking/"', 'href="monthly-strategy.html?v=16"'):
              if marker not in upgrades:
                  raise SystemExit(f"Beginner upgrade is missing: {marker}")
          for marker in ("rank_change", "今月NEW", "節目接近"):
              if marker not in market_pages:
                  raise SystemExit(f"Market page feature is missing: {marker}")
          for marker in (
              "MONTHLY STRATEGY MEETING", 'data-layout-version="16"',
              "monthly-stock-list", "monthly-strategy-v16.css",
          ):
              if marker not in monthly_strategy:
                  raise SystemExit(f"Monthly strategy page is missing: {marker}")
          if "monthly-strategy.html" not in monthly_redirect:
              raise SystemExit("Old monthly report URL does not redirect to the strategy page")
          for name in (
              "ranking.html", "monthly-report.html", "monthly-strategy.html", "history.html",
              "ranking/index.html", "monthly-report/index.html", "assets/monthly-strategy-v16.css",
          ):
              if not Path(name).exists():
                  raise SystemExit(f"Public page missing: {name}")
          for name in ("ranking/index.html", "monthly-report/index.html"):
              if '<base href="../">' not in Path(name).read_text(encoding="utf-8"):
                  raise SystemExit(f"Nested public route has no root base: {name}")
          for marker in (
              '"./ranking/"', '"./ranking/index.html"', '"./monthly-report/"', '"./monthly-report/index.html"',
              '"./monthly-strategy.html"', '"./assets/monthly-strategy-v16.css"',
              '"./assets/provisional-monthly-rsi-core.js"', '"./assets/copy-audit.js"', "routeAlternatives",
          ):
              if marker not in service_worker:
                  raise SystemExit(f"Service worker route/cache item missing: {marker}")
          for marker in ("monthly-strategy.html", "MONTHLY STRATEGY MEETING", "monthly-strategy-v16.css"):
              if marker not in deploy:
                  raise SystemExit(f"Pages deployment is missing: {marker}")
          if "python provisional_signal.py" not in daily_workflow:
              raise SystemExit("Daily provisional signal generator is not wired")
          if "build_market_reports.py --monthly" not in workflow:
              raise SystemExit("Monthly report generator is not wired")
          if "build_market_reports.py" not in daily_workflow:
              raise SystemExit("Daily ranking generator is not wired")
          if "SKIP_FUNDAMENTALS: \"1\"" not in workflow:
              raise SystemExit("Monthly workflow may issue bulk fundamental requests")

          forbidden_links = ("href=\"analysis.html", "href=\"analysis-lab.html", "release.tdnet.info")
          for path in list(Path(".").glob("*.html")) + list(Path("assets").glob("*.js")):
              if path.name in {"analysis.html", "analysis-lab.html"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for marker in forbidden_links:
                  if marker in text:
                      raise SystemExit(f"Discarded link remains in {path}: {marker}")
          print("Kabutane public page structure passed")
          PY
