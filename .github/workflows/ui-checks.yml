name: Validate site UI

on:
  pull_request:
    paths:
      - "index.html"
      - "backtest.html"
      - "replay.html"
      - "detail.html"
      - "howto.html"
      - "learn.html"
      - "signal-method.html"
      - "assets/**"
      - "tradingview_signal.py"
      - "generate_tradingview.py"
      - "tests/**"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python signal engine
        run: |
          python -m py_compile tradingview_signal.py generate_tradingview.py tests/test_tradingview_signal.py
          python -m unittest discover -s tests -p 'test_tradingview_signal.py' -v

      - name: Check JavaScript syntax
        run: |
          for file in assets/*.js; do node --check "$file"; done

      - name: Test JavaScript engines
        run: |
          node tests/test_backtest_engine.js
          node tests/test_replay_engine.js
          node tests/test_replay_v2.js
          node tests/test_detail_enhancements.js
          node tests/test_signal_v2.js

      - name: Validate HTML and CSS
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for name in ("index.html", "backtest.html", "replay.html", "detail.html", "howto.html", "learn.html", "signal-method.html"):
              Parser().feed(Path(name).read_text(encoding="utf-8"))

          for path in Path("assets").glob("*.css"):
              css = path.read_text(encoding="utf-8")
              if css.count("{") != css.count("}"):
                  raise SystemExit(f"CSS braces are not balanced: {path}")
          print("HTML/CSS validation passed")
          PY

      - name: Audit public page structure
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path("index.html").read_text(encoding="utf-8")
          deploy = Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          characters = Path("assets/characters.js").read_text(encoding="utf-8")
          if "かぶたね" not in index or "assets/kabutane.css" not in index:
              raise SystemExit("Kabutane home is not wired")
          if "analysis-lab.html" in deploy:
              raise SystemExit("Discarded analysis lab is still deployed")
          if 'assets/signal-v2.js' not in characters:
              raise SystemExit("Common pages do not load signal-v2.js")
          print("Public page structure passed")
          PY
