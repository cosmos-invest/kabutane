name: Validate site UI

on:
  pull_request:
    paths:
      - "index.html"
      - "backtest.html"
      - "replay.html"
      - "detail.html"
      - "howto.html"
      - "learn.html"
      - "signal-method.html"
      - "assets/**"
      - "update_daily.py"
      - "update_universe.py"
      - "generate_tradingview.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python signal and update engines
        run: |
          python -m py_compile tradingview_signal.py generate_tradingview.py update_daily.py update_universe.py
          python -m unittest discover -s tests -p 'test_tradingview_signal.py' -v
          python -m unittest discover -s tests -p 'test_update_daily.py' -v
          python -m unittest discover -s tests -p 'test_update_universe.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check assets/backtest.js
          node --check assets/replay-core-v2.js
          node --check assets/replay-ui-base-v2.js
          node --check assets/replay-charts-v2.js
          node --check assets/replay-render-v2.js
          node --check assets/replay-orders-basic-v2.js
          node --check assets/replay-orders-auto-v2.js
          node --check assets/replay-session-v2.js
          node --check assets/replay-picker.js
          node --check assets/daily-overlay.js
          node --check assets/detail-enhancements.js
          node --check assets/simple-analysis-cosmos.js
          node --check assets/kabutane-screening.js
          node --check assets/signal-v2.js
          node --check assets/characters.js

      - name: Test JavaScript engines
        run: |
          node tests/test_backtest_engine.js
          node tests/test_replay_v2.js
          node tests/test_detail_enhancements.js
          node tests/test_daily_overlay.js
          node tests/test_signal_v2.js

      - name: Validate HTML and CSS
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for name in (
              "index.html", "backtest.html", "replay.html", "detail.html",
              "howto.html", "learn.html", "signal-method.html",
          ):
              Parser().feed(Path(name).read_text(encoding="utf-8"))

          for name in (
              "assets/backtest.css", "assets/replay.css", "assets/replay-v2.css",
              "assets/detail-enhancements.css", "assets/simple-analysis-cosmos.css",
              "assets/kabutane.css", "assets/kabutane-characters.css", "assets/kabutane-links.css",
          ):
              css = Path(name).read_text(encoding="utf-8")
              if css.count("{") != css.count("}"):
                  raise SystemExit(f"CSS braces are not balanced: {name}")
          print("HTML/CSS validation passed")
          PY

      - name: Audit public page structure
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          detail = Path("detail.html").read_text(encoding="utf-8")
          replay = Path("replay.html").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")

          required = ["かぶたね", "cosmos-hero.webp", "homePracticeLink", "note.com/cosmos_invest"]
          for marker in required:
              if marker not in index:
                  raise SystemExit(f"Index is missing: {marker}")
          if "assets/daily-overlay.js" not in detail or "assets/daily-overlay.js" not in replay:
              raise SystemExit("Daily overlay is not wired to detail and replay")
          if "assets/replay-picker.js" not in replay or "replaySymbolSelect" not in replay:
              raise SystemExit("Replay candidate picker is not wired")
          if "SKIP_FUNDAMENTALS: \"1\"" not in workflow:
              raise SystemExit("Monthly workflow may issue bulk fundamental requests")
          print("Kabutane public page structure passed")
          PY
