name: Update monthly RSI data

on:
  workflow_dispatch:
  schedule:
    # 毎月2日 12:15 JST（前月の月足確定後）
    - cron: "15 3 2 * *"
  workflow_run:
    workflows: ["Refresh TSE stock universe"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "stocks.csv"
      - "test.py"
      - "tradingview_signal.py"
      - "generate_tradingview.py"
      - "tests/test_logic.py"
      - "tests/test_tradingview_signal.py"

permissions:
  contents: write

concurrency:
  group: update-monthly-rsi
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile test.py tradingview_signal.py generate_tradingview.py tests/test_logic.py tests/test_tradingview_signal.py
          git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate all data with canonical signal
        env:
          HISTORY_MONTHS: "60"
          MONTHLY_PERIOD: "max"
          DAILY_PERIOD: "3y"
          ANALYSIS_DAILY_PERIOD: "5y"
          YF_BATCH_SIZE: "100"
          SKIP_FUNDAMENTALS: "1"
        run: |
          python generate_tradingview.py
          # 月次チャートへ最新日足が取り込まれたため、小さな日次差分をリセット。
          rm -rf data/daily

      - name: Verify generated signal version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "tv_wilder_rsi14_sma5_v1"
          targets = [Path("data/latest.json"), Path("data/analysis.json")]
          for path in targets:
              payload = json.loads(path.read_text(encoding="utf-8"))
              actual = payload.get("signal_version")
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
          print("Canonical signal version verified")
          PY

      - name: Build data quality report
        run: python diagnose_errors.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A result.csv out.csv data history DATA_QUALITY.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: rebuild zero-cost Yahoo market data"
            git push origin main
          fi
