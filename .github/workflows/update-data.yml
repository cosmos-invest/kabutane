name: Update monthly RSI data

on:
  workflow_dispatch:
  schedule:
    # 毎月2日 12:15 JST（前月の月足確定後）
    - cron: "15 3 2 * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "test.py"
      - "tradingview_signal.py"
      - "generate_tradingview.py"
      - "tests/test_logic.py"
      - "tests/test_tradingview_signal.py"

permissions:
  contents: write

concurrency:
  group: update-monthly-rsi
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile test.py tradingview_signal.py generate_tradingview.py tests/test_logic.py tests/test_tradingview_signal.py
          git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate all data with canonical signal
        env:
          HISTORY_MONTHS: "60"
          # RMA inherits older observations. Use the longest available monthly
          # history, then publish only the configured five-year analysis window.
          MONTHLY_PERIOD: "max"
          DAILY_PERIOD: "3y"
          ANALYSIS_DAILY_PERIOD: "5y"
          YF_BATCH_SIZE: "80"
          FUNDAMENTALS_WORKERS: "3"
        run: python generate_tradingview.py

      - name: Verify generated signal version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "tv_wilder_rsi14_sma5_v1"
          targets = [Path("data/latest.json"), Path("data/analysis.json")]
          for path in targets:
              payload = json.loads(path.read_text(encoding="utf-8"))
              actual = payload.get("signal_version")
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
          print("Canonical signal version verified")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A result.csv out.csv data history
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: rebuild data with TradingView RSI14 signal"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
