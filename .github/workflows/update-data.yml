name: Update monthly RSI data

on:
  workflow_dispatch:
  schedule:
    # 毎月2日 12:15 JST（前月の月足確定後）
    - cron: "15 3 2 * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "test.py"
  pull_request:
    paths:
      - ".github/hotfix-datetime-precision.md"

permissions:
  contents: write

concurrency:
  group: update-monthly-rsi
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply datetime precision hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("test.py")
          source = source_path.read_text(encoding="utf-8")
          old_source = """    dates = list(chart_frame.index)

              def visible_date_after(month: pd.Period) -> str | None:
                  position = chart_frame.index.searchsorted(month.end_time, side=\"right\") if dates else 0
                  return dates[position].strftime(\"%Y-%m-%d\") if position < len(dates) else None
          """.replace("              ", "    ")
          new_source = """    dates = list(chart_frame.index)
              calendar_dates = [pd.Timestamp(date).date() for date in dates]

              def visible_date_after(month: pd.Period) -> str | None:
                  position = bisect_right(calendar_dates, month.end_time.date()) if calendar_dates else 0
                  return dates[position].strftime(\"%Y-%m-%d\") if position < len(dates) else None
          """.replace("              ", "    ")
          if old_source in source:
              source = source.replace(old_source, new_source, 1)
          elif new_source not in source:
              raise SystemExit("visible_date_after target block was not found")
          source_path.write_text(source, encoding="utf-8")
          PY

      - name: Validate source
        run: |
          python -m py_compile test.py tests/test_logic.py
          git diff --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test.py
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "fix: handle datetime precision in chart events"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Generate data
        env:
          HISTORY_MONTHS: "60"
          MONTHLY_PERIOD: "10y"
          DAILY_PERIOD: "3y"
          ANALYSIS_DAILY_PERIOD: "5y"
          YF_BATCH_SIZE: "80"
          FUNDAMENTALS_WORKERS: "3"
        run: python test.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.csv out.csv data history
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update monthly RSI data"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
