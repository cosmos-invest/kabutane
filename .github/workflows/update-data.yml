name: Update monthly RSI data

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh TSE stock universe"]
    types: [completed]
  schedule:
    # 毎月2日 12:15 JST（前月の月足確定後）
    - cron: "15 3 2 * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-data.yml"
      - "stocks.csv"
      - "test.py"
      - "tradingview_signal.py"
      - "generate_tradingview.py"
      - "build_market_reports.py"
      - "validate_data_contract.py"
      - "tests/test_logic.py"
      - "tests/test_tradingview_signal.py"
      - "tests/test_market_reports.py"
      - "tests/test_data_contract.py"

permissions:
  contents: write

# 月次・日次・銘柄マスター更新を直列化し、同じデータへの同時pushを防ぐ。
concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    # 銘柄マスター更新が失敗した場合は全データ生成へ進まない。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile test.py tradingview_signal.py generate_tradingview.py build_market_reports.py validate_data_contract.py tests/test_logic.py tests/test_tradingview_signal.py tests/test_market_reports.py tests/test_data_contract.py
          git diff --check

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Run each test module in a fresh Python process. This prevents test
          # state from leaking between modules while still executing every test.
          for test_file in tests/test_*.py; do
            echo "::group::${test_file}"
            python -m unittest discover -s tests -p "$(basename "${test_file}")" -v
            echo "::endgroup::"
          done

      - name: Generate all data with canonical signal
        env:
          HISTORY_MONTHS: "60"
          MONTHLY_PERIOD: "max"
          DAILY_PERIOD: "3y"
          ANALYSIS_DAILY_PERIOD: "5y"
          YF_BATCH_SIZE: "100"
          SKIP_FUNDAMENTALS: "1"
        run: |
          python generate_tradingview.py
          python build_market_reports.py --monthly
          # 月次チャートへ最新日足が取り込まれたため、小さな日次差分をリセット。
          rm -rf data/daily

      - name: Verify generated signal version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = "tv_wilder_rsi14_sma5_v1"
          targets = [Path("data/latest.json"), Path("data/analysis.json")]
          for path in targets:
              payload = json.loads(path.read_text(encoding="utf-8"))
              actual = payload.get("signal_version")
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {actual}")
          print("Canonical signal version verified")
          PY

      - name: Validate generated data contract
        run: python validate_data_contract.py

      - name: Build data quality report
        run: python diagnose_errors.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A result.csv out.csv data history DATA_QUALITY.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: rebuild market data and monthly change report"
            git push origin main
          fi
