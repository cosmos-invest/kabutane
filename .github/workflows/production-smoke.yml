name: Production smoke test

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KABUTANE_BASE_URL: https://cosmos-invest.github.io/kabutane
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for published site
        run: |
          for i in {1..30}; do
            if curl -fsS "${KABUTANE_BASE_URL}/index.html" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Smoke test production on desktop and Android widths
        run: |
          npx playwright test tests/full-regression.spec.js \
            --grep "^(desktop|android): (home search|stock detail|ranking|monthly strategy|replay selection|replay setup)$" \
            --reporter=line \
            --trace=retain-on-failure

      - name: Upload production failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-failure
          path: test-results/
          if-no-files-found: ignore
