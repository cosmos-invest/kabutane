name: Retry incomplete Yahoo histories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/run-incomplete-retry.txt"
      - "retry_incomplete.py"
      - ".github/workflows/retry-incomplete.yml"

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Let Yahoo cooldown after bulk jobs
        run: sleep 180

      - name: Retry only incomplete monthly histories
        run: python retry_incomplete.py

      - name: Commit diagnostic result
        run: |
          if git diff --quiet -- data/diagnostics/incomplete-retry.json; then
            echo "No diagnostic changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/incomplete-retry.json
          git commit -m "diagnostics: retry incomplete Yahoo histories"
          git pull --rebase origin main
          git push origin main
