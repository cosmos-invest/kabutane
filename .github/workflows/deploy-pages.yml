name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Update daily candidate prices", "Update monthly RSI data", "Audit data quality", "Update JPX margin balance", "Update extended listed universe", "Update core universe data"]
    types: [completed]
  pull_request:
    types: [closed]
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "data/**"
      - "history/**"
      - "result.csv"
      - "out.csv"
      - "validate_data_contract.py"
      - "scripts/public_core_radar.py"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate current data contract
        run: python validate_data_contract.py

      - name: Build public-safe all-stock radar
        run: python -m scripts.public_core_radar

      - name: Prepare site
        run: |
          mkdir -p _site
          cp \
            index.html detail.html backtest.html replay.html replay-select.html howto.html learn.html signal-method.html \
            ranking.html monthly-report.html monthly-strategy.html history.html shikiho-summer-2026.html today.html all-stocks.html monthly-dc.html \
            extended-universe.html premium-supply-beta.html \
            manifest.webmanifest sw.js .nojekyll result.csv out.csv \
            _site/
          cp -R assets data history ranking monthly-report _site/
          # Discovery of provisional GC stays premium-only. The public all-stock
          # page uses public-radar.json, so the raw batch radar is not published.
          # Individual detail payloads intentionally keep provisional GC/DC.
          rm -f _site/data/core/radar.json

      - name: Verify public pages and PWA files
        run: |
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/replay-select.html
          test -f _site/ranking.html
          test -f _site/monthly-report.html
          test -f _site/monthly-strategy.html
          test -f _site/history.html
          test -f _site/shikiho-summer-2026.html
          test -f _site/today.html
          test -f _site/all-stocks.html
          test -f _site/monthly-dc.html
          test -f _site/extended-universe.html
          test -f _site/premium-supply-beta.html
          test -f _site/ranking/index.html
          test -f _site/monthly-report/index.html
          test -f _site/assets/monthly-strategy-v16.css
          test -f _site/assets/shikiho-room.css
          test -f _site/assets/shikiho-room.js
          test -f _site/assets/today-kabutane.css
          test -f _site/assets/today-kabutane.js
          test -f _site/assets/all-stocks.css
          test -f _site/assets/all-stocks.js
          test -f _site/assets/extended-universe.css
          test -f _site/assets/extended-universe.js
          test -f _site/assets/premium-supply-beta.css
          test -f _site/assets/premium-supply-beta.js
          test -f _site/assets/replay-stock-select.js
          test -f _site/assets/replay-picker.css
          test -f _site/data/core/public-radar.json
          test ! -f _site/data/core/radar.json
          test -f _site/data/curated/shikiho-2026-summer.json
          test -f _site/data/curated/shikiho-2026-summer-performance.json
          test -f _site/assets/icons/kabutane-wordmark-v3.svg
          test -f _site/assets/icons/kabutane-192.png
          test -f _site/assets/replay-drawing-tools.js
          grep -q 'kabutane-wordmark-v3.svg' _site/manifest.webmanifest
          grep -q 'assets/replay-drawing-tools.js' _site/replay.html
          grep -q 'replay-stock-select.js' _site/replay-select.html
          grep -q 'MONTHLY RSI CROSS RANKING' _site/ranking.html
          grep -q 'monthly-strategy.html' _site/monthly-report.html
          grep -q 'MONTHLY STRATEGY MEETING' _site/monthly-strategy.html
          grep -q 'data-layout-version="16"' _site/monthly-strategy.html
          grep -q 'monthly-strategy-v16.css' _site/monthly-strategy.html
          grep -q '四季報観察室｜2026年夏号' _site/shikiho-summer-2026.html
          grep -q 'n07501f295da0' _site/shikiho-summer-2026.html
          grep -q '2026-06-18' _site/data/curated/shikiho-2026-summer.json
          grep -q '今日のかぶたね' _site/today.html
          grep -q 'data/daily-events.json' _site/assets/today-kabutane.js
          grep -q '全銘柄一覧' _site/all-stocks.html
          grep -q 'data/core/public-radar.json' _site/assets/all-stocks.js
          ! grep -q 'fetch(`data/core/radar.json' _site/assets/all-stocks.js
          ! grep -q '"provisional_status":"GC"' _site/data/core/public-radar.json
          ! grep -q 'monthly_rsi_spread' _site/data/core/public-radar.json
          grep -q 'all-stocks.html' _site/index.html
          grep -q 'all-stocks.html?signal=DC' _site/monthly-dc.html
          grep -q '拡張対象銘柄' _site/extended-universe.html
          grep -q 'noindex,nofollow,noarchive' _site/premium-supply-beta.html
          ! grep -R -q 'premium-supply-beta.html' _site/index.html _site/learn.html _site/howto.html
          grep -q '暫定GC / 暫定DC' _site/detail.html
          node --check _site/assets/all-stocks.js
          node --check _site/assets/core-detail-fallback.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
