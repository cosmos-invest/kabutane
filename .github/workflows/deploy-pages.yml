name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Update monthly RSI data"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "detail.html"
      - "assets/**"
      - "data/**"
      - "history/**"
      - "result.csv"
      - "out.csv"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html detail.html .nojekyll result.csv out.csv _site/
          cp -R assets data history _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
