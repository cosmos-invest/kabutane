name: Update JPX margin balance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-margin-balance.yml'

permissions:
  contents: write

jobs:
  apply-pr77-split-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/watchlist-premium-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed patch
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/pr77-final.patch > /tmp/pr77-final.patch
          git apply --check /tmp/pr77-final.patch
          git apply /tmp/pr77-final.patch
          python -m py_compile scripts/build_core_universe_data.py scripts/premium_research.py tests/test_premium_research.py
          python -m unittest tests.test_premium_research tests.test_logic -v
          git diff --check
      - name: Push corrected PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn.html scripts/build_core_universe_data.py scripts/premium_research.py tests/test_premium_research.py
          git commit -m 'fix: normalize premium outcomes across stock splits'
          git push origin HEAD:feature/watchlist-premium-research
