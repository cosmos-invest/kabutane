name: Apply PR77 final review fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/pr77-final-review-trigger.txt'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr77-final-review-fixes
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/watchlist-premium-research
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: target not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Premium radar: record the actual generation time rather than
          # copying the older core-radar timestamp into margin-triggered builds.
          path = Path('scripts/build_premium_lab.py')
          replace_once(
              path,
              'import json\nimport math\nfrom pathlib import Path\n',
              'import json\nimport math\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n',
              'premium import datetime',
          )
          replace_once(
              path,
              'def build_payload() -> dict[str, Any]:\n    radar = load_json(CORE_RADAR, {})\n',
              'def build_payload() -> dict[str, Any]:\n    recorded_at = datetime.now(timezone.utc).isoformat()\n    radar = load_json(CORE_RADAR, {})\n',
              'premium recorded_at',
          )
          replace_once(
              path,
              '        "generated_at": radar.get("generated_at"),\n        "price_date": max((str(item.get("price_date") or "") for item in rows), default="") or None,\n',
              '        "generated_at": recorded_at,\n        "recorded_at": recorded_at,\n        "source_core_generated_at": radar.get("generated_at"),\n        "price_date": max((str(item.get("price_date") or "") for item in rows), default="") or None,\n',
              'premium payload timestamps',
          )

          # 2) Research engine: availability timestamp, retained split ledger,
          # and challenger-specific maturity gates.
          path = Path('scripts/premium_research.py')
          replace_once(
              path,
              'from datetime import date\nfrom pathlib import Path\nfrom typing import Any\n',
              'from datetime import date, datetime, timezone\nfrom pathlib import Path\nfrom typing import Any\nfrom zoneinfo import ZoneInfo\n',
              'research datetime imports',
          )
          replace_once(
              path,
              'SUMMARY_PATH = RESEARCH_ROOT / "summary.json"\nENGINE_VERSION = "priority_v1_44_20_26_10"\n',
              'SUMMARY_PATH = RESEARCH_ROOT / "summary.json"\nSPLIT_ARCHIVE_ROOT = RESEARCH_ROOT / "split-events"\nENGINE_VERSION = "priority_v1_44_20_26_10"\nTOKYO = ZoneInfo("Asia/Tokyo")\n',
              'research constants',
          )
          replace_once(
              path,
              '        "generated_at": payload.get("generated_at"),\n        "engine_version": str(payload.get("engine_version") or ENGINE_VERSION),\n',
              '        "generated_at": payload.get("generated_at"),\n        "recorded_at": payload.get("recorded_at") or payload.get("generated_at"),\n        "engine_version": str(payload.get("engine_version") or ENGINE_VERSION),\n',
              'snapshot recorded_at',
          )

          old = '''def cohort_rows(snapshot: dict[str, Any]) -> list[dict[str, Any]]:\n    cohort_date = str(snapshot.get("price_date") or "")\n    return [row for row in observation_rows(snapshot) if row.get("price_date") == cohort_date]\n\n\ndef latest_snapshot_per_date(snapshots: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    by_date: dict[str, dict[str, Any]] = {}\n    for snapshot in snapshots:\n        key = str(snapshot.get("price_date") or "")\n        if key:\n            by_date[key] = snapshot\n    return [by_date[key] for key in sorted(by_date)]\n'''
          new = '''def snapshot_recorded_date(snapshot: dict[str, Any]) -> str | None:\n    raw = str(snapshot.get("recorded_at") or "").strip()\n    if not raw:\n        return None\n    try:\n        value = datetime.fromisoformat(raw.replace("Z", "+00:00"))\n        if value.tzinfo is None:\n            value = value.replace(tzinfo=timezone.utc)\n        return value.astimezone(TOKYO).date().isoformat()\n    except (TypeError, ValueError):\n        return None\n\n\ndef cohort_rows(snapshot: dict[str, Any]) -> list[dict[str, Any]]:\n    cohort_date = str(snapshot.get("price_date") or "")\n    recorded_date = snapshot_recorded_date(snapshot)\n    # A margin-triggered generation may use an older core close. Preserve the\n    # generation in history, but never evaluate it as if the later supply data\n    # had been known on that earlier price date.\n    if recorded_date and cohort_date and recorded_date > cohort_date:\n        return []\n    return [row for row in observation_rows(snapshot) if row.get("price_date") == cohort_date]\n\n\ndef latest_snapshot_per_date(snapshots: list[dict[str, Any]]) -> list[dict[str, Any]]:\n    by_date: dict[str, dict[str, Any]] = {}\n    for snapshot in snapshots:\n        if not cohort_rows(snapshot):\n            continue\n        key = str(snapshot.get("price_date") or "")\n        if key:\n            by_date[key] = snapshot\n    return [by_date[key] for key in sorted(by_date)]\n'''
          replace_once(path, old, new, 'cohort availability guard')

          marker = '''def cumulative_split_ratio(\n    split_events: dict[str, list[tuple[str, float]]], code: str, start_date: str, exit_date: str\n) -> float:\n'''
          addition = '''def resolved_split_archive_path(split_archive_path: Path | None, engine_version: str) -> Path:\n    return split_archive_path if split_archive_path is not None else SPLIT_ARCHIVE_ROOT / f"{safe_engine_version(engine_version)}.json"\n\n\ndef load_archived_split_events(path: Path, engine_version: str) -> dict[str, list[tuple[str, float]]]:\n    payload = load_json(path, {})\n    if payload and str(payload.get("engine_version") or "") != engine_version:\n        return {}\n    result: dict[str, list[tuple[str, float]]] = {}\n    for code, rows in (payload.get("events") or {}).items():\n        values: list[tuple[str, float]] = []\n        for row in rows or []:\n            if not isinstance(row, list) or len(row) < 2:\n                continue\n            ratio = finite(row[1])\n            if row[0] and ratio not in (None, 0):\n                values.append((str(row[0]), float(ratio)))\n        if values:\n            result[str(code)] = sorted(values)\n    return result\n\n\ndef merge_split_events(*sources: dict[str, list[tuple[str, float]]]) -> dict[str, list[tuple[str, float]]]:\n    merged: dict[str, dict[str, float]] = defaultdict(dict)\n    for source in sources:\n        for code, rows in source.items():\n            for event_date, ratio in rows:\n                if event_date and finite(ratio) not in (None, 0):\n                    merged[str(code)][str(event_date)] = float(ratio)\n    return {code: sorted(values.items()) for code, values in merged.items()}\n\n\ndef archive_split_events(\n    current_events: dict[str, list[tuple[str, float]]],\n    path: Path,\n    engine_version: str,\n) -> dict[str, list[tuple[str, float]]]:\n    existing = load_archived_split_events(path, engine_version)\n    merged = merge_split_events(existing, current_events)\n    write_json(path, {\n        "schema_version": 1,\n        "kind": "premium_split_event_archive",\n        "engine_version": engine_version,\n        "events": {code: [[event_date, round(ratio, 8)] for event_date, ratio in rows] for code, rows in sorted(merged.items())},\n    })\n    return merged\n\n\n'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('split archive insertion marker not found')
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          replace_once(
              path,
              '    premium_path: Path = PREMIUM_RADAR,\n    outcomes_root: Path | None = None,\n) -> dict[str, Any]:\n',
              '    premium_path: Path = PREMIUM_RADAR,\n    outcomes_root: Path | None = None,\n    split_archive_path: Path | None = None,\n) -> dict[str, Any]:\n',
              'evaluate signature',
          )
          replace_once(
              path,
              '    series = load_price_series(core_root)\n    split_events = load_split_events(core_root)\n    finalization = finalize_outcomes(snapshots, series, target_outcomes_root, engine_version, split_events)\n',
              '    series = load_price_series(core_root)\n    current_split_events = load_split_events(core_root)\n    split_events = (\n        archive_split_events(current_split_events, split_archive_path, engine_version)\n        if split_archive_path is not None\n        else current_split_events\n    )\n    finalization = finalize_outcomes(snapshots, series, target_outcomes_root, engine_version, split_events)\n',
              'evaluate split archive',
          )

          marker = '''def evaluate(\n'''
          helper = '''def experiment_is_mature(values: dict[str, Any]) -> bool:\n    result5 = values.get("5d") or {}\n    result20 = values.get("20d") or {}\n    return int(result5.get("cohorts") or 0) >= 20 and int(result20.get("cohorts") or 0) >= 12\n\n\n'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('experiment helper insertion marker not found')
          path.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')

          old = '''    history_start = dated_snapshots[0].get("price_date") if dated_snapshots else None\n    latest_snapshot = dated_snapshots[-1].get("price_date") if dated_snapshots else None\n    recommendation_ready = mature_counts["20d"] >= 12 and mature_counts["5d"] >= 20\n    best_experiment = None\n    if recommendation_ready:\n        candidates = []\n        for name, values in experiment_result.items():\n            result20 = values.get("20d") or {}\n            excess = finite(result20.get("excess_vs_all_core_pct"))\n            if excess is not None:\n                candidates.append((excess, name))\n        if candidates:\n            _, best_experiment = max(candidates)\n'''
          new = '''    history_start = dated_snapshots[0].get("price_date") if dated_snapshots else None\n    latest_snapshot = dated_snapshots[-1].get("price_date") if dated_snapshots else None\n    eligible_experiments = [name for name, values in experiment_result.items() if experiment_is_mature(values)]\n    recommendation_ready = bool(eligible_experiments)\n    best_experiment = None\n    if recommendation_ready:\n        candidates = []\n        for name in eligible_experiments:\n            result20 = experiment_result[name].get("20d") or {}\n            excess = finite(result20.get("excess_vs_all_core_pct"))\n            if excess is not None:\n                candidates.append((excess, name))\n        if candidates:\n            _, best_experiment = max(candidates)\n'''
          replace_once(path, old, new, 'challenger maturity gate')
          replace_once(
              path,
              '        "best_challenger": best_experiment,\n        "guardrail":',
              '        "best_challenger": best_experiment,\n        "eligible_challengers": eligible_experiments,\n        "guardrail":',
              'summary eligible challengers',
          )

          old = '''def run(\n    payload_path: Path = PREMIUM_RADAR,\n    history_root: Path | None = None,\n    summary_path: Path = SUMMARY_PATH,\n    core_root: Path | None = None,\n    outcomes_root: Path | None = None,\n) -> dict[str, Any]:\n    record_snapshot(payload_path, history_root)\n    summary = evaluate(history_root, core_root, payload_path, outcomes_root)\n    write_json(summary_path, summary)\n    return summary\n'''
          new = '''def run(\n    payload_path: Path = PREMIUM_RADAR,\n    history_root: Path | None = None,\n    summary_path: Path = SUMMARY_PATH,\n    core_root: Path | None = None,\n    outcomes_root: Path | None = None,\n    split_archive_path: Path | None = None,\n) -> dict[str, Any]:\n    payload = load_json(payload_path, {})\n    engine_version = str(payload.get("engine_version") or ENGINE_VERSION)\n    target_split_archive = resolved_split_archive_path(split_archive_path, engine_version)\n    record_snapshot(payload_path, history_root)\n    summary = evaluate(history_root, core_root, payload_path, outcomes_root, target_split_archive)\n    write_json(summary_path, summary)\n    return summary\n'''
          replace_once(path, old, new, 'run split archive')
          replace_once(
              path,
              '    parser.add_argument("--outcomes-root", type=Path, default=None)\n    parser.add_argument("--summary", type=Path, default=SUMMARY_PATH)\n',
              '    parser.add_argument("--outcomes-root", type=Path, default=None)\n    parser.add_argument("--split-archive", type=Path, default=None)\n    parser.add_argument("--summary", type=Path, default=SUMMARY_PATH)\n',
              'split archive cli',
          )
          replace_once(
              path,
              '    summary = run(args.payload, args.history_root, args.summary, args.core_root, args.outcomes_root)\n',
              '    summary = run(args.payload, args.history_root, args.summary, args.core_root, args.outcomes_root, args.split_archive)\n',
              'run cli call',
          )

          # 3) Tests for information availability, archived corporate actions,
          # and per-challenger maturity.
          path = Path('tests/test_premium_research.py')
          marker = '''    def test_future_return_rejects_entry_outside_retained_window(self):\n'''
          addition = '''    def test_later_recorded_generation_is_not_backdated_into_old_price_cohort(self):\n        eligible_payload = self.opportunity("2026-07-03")\n        eligible_payload["recorded_at"] = "2026-07-03T07:00:00+00:00"\n        late_payload = self.opportunity("2026-07-03", shift=4)\n        late_payload["recorded_at"] = "2026-07-03T16:00:00+00:00"\n        eligible = research.compact_snapshot(eligible_payload)\n        late = research.compact_snapshot(late_payload)\n        self.assertEqual(research.cohort_rows(late), [])\n        latest = research.latest_snapshot_per_date([eligible, late])\n        self.assertEqual(len(latest), 1)\n        self.assertEqual(research.cohort_rows(latest[0])[0]["price"], 100.0)\n\n    def test_challenger_readiness_uses_its_own_complete_cohorts(self):\n        self.assertFalse(research.experiment_is_mature({"5d": {"cohorts": 20}, "20d": {"cohorts": 11}}))\n        self.assertFalse(research.experiment_is_mature({"5d": {"cohorts": 19}, "20d": {"cohorts": 12}}))\n        self.assertTrue(research.experiment_is_mature({"5d": {"cohorts": 20}, "20d": {"cohorts": 12}}))\n\n'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('test availability insertion marker not found')
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          marker = '''    def test_evaluate_tracks_forward_returns_and_market_excess(self):\n'''
          addition = '''    def test_archived_split_survives_current_shard_removal(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            history = root / "history"\n            outcomes = root / "outcomes"\n            core = root / "core"\n            premium = root / "opportunity.json"\n            archive = root / "split-events.json"\n            first_payload = self.opportunity("2026-07-03")\n            second_payload = self.opportunity("2026-07-10")\n            second_payload["records"][0]["current_price"] = 52.5\n            first = research.compact_snapshot(first_payload)\n            second = research.compact_snapshot(second_payload)\n            self.write_history(history, [first, second])\n            self.write_prices(core, {"1002", "1003"})\n            premium.write_text(json.dumps(second_payload), encoding="utf-8")\n            research.archive_split_events({"1001": [("2026-07-10", 2.0)]}, archive, research.ENGINE_VERSION)\n            retained = research.archive_split_events({}, archive, research.ENGINE_VERSION)\n            self.assertEqual(research.cumulative_split_ratio(retained, "1001", "2026-07-03", "2026-07-10"), 2.0)\n            research.evaluate(history, core, premium, outcomes, archive)\n            ledger = json.loads(next(outcomes.glob("*.json")).read_text(encoding="utf-8"))\n            result = ledger["cohorts"][first["snapshot_id"]]["5d"]["1001"]\n            self.assertEqual(result[3], 5.0)\n            self.assertEqual(result[5], 2.0)\n\n'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('split archive test marker not found')
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          # 4) Developer invariants and learning copy stay synchronized.
          path = Path('AGENTS.md')
          replace_once(
              path,
              '- 各銘柄の `price_date` とsnapshot基準日が一致するものだけをその日のcohortへ採用し、古い価格を新しい日のエントリー価格として使わない。\n',
              '- 各銘柄の `price_date` とsnapshot基準日が一致するものだけをその日のcohortへ採用し、古い価格を新しい日のエントリー価格として使わない。さらにsnapshotの実生成時刻 `recorded_at` を保存し、新しい信用需給などが利用可能になった日より古い株価日へ情報を遡及させない。`recorded_at` の日本日付が株価基準日より後なら、そのgenerationは履歴には残してもcohortへ採用しない。\n',
              'AGENTS availability',
          )
          replace_once(
              path,
              '- `auto_adjust=False` のpoint-in-time価格で期間リターンを測る場合、cohort日の翌日から実際のexit日までに発生した株式分割・併合比率を累積して経済的リターンへ補正してからoutcome台帳へ固定する。補正係数も保存し、分割・併合を投資損益と誤認しない。この研究値は株式分割・併合を補正した価格リターンであり、配当再投資込みのトータルリターンとは区別する。\n',
              '- `auto_adjust=False` のpoint-in-time価格で期間リターンを測る場合、cohort日の翌日から実際のexit日までに発生した株式分割・併合比率を累積して経済的リターンへ補正してからoutcome台帳へ固定する。補正係数も保存し、分割・併合を投資損益と誤認しない。観測した分割・併合イベントは `data/premium/research/split-events/<engine_version>.json` に保持し、銘柄が後からcurrent shardやcore universeを離れても補正係数を失わない。この研究値は株式分割・併合を補正した価格リターンであり、配当再投資込みのトータルリターンとは区別する。\n',
              'AGENTS split archive',
          )
          replace_once(
              path,
              '- 過学習を避けるため、正式な重み見直し候補は週次コホートで判定し、少なくとも5営業日後の成熟コホート20週、20営業日後の成熟コホート12週がたまるまでは現行エンジンを維持する。\n',
              '- 過学習を避けるため、正式な重み見直し候補は週次コホートで判定し、各challenger自身についてTop20のoutcomeが全件そろった5営業日後コホート20週・20営業日後コホート12週がたまるまでは候補にしない。全体cohortの成熟数だけでchallengerを昇格させず、現行エンジンを自動変更しない。\n',
              'AGENTS challenger maturity',
          )

          path = Path('learn.html')
          replace_once(
              path,
              '      <p class="learn-callout"><strong>重みは自動で変更しません。</strong> 現行スコアとは別に「月足重視」「需給重視」「日足・出来高重視」「財務重視」の挑戦者を同時に計算し、週次コホートで比較します。少なくとも5営業日後の検証20週、20営業日後の検証12週がたまるまでは、現行エンジンを維持します。</p>\n',
              '      <p class="learn-callout"><strong>重みは自動で変更しません。</strong> 現行スコアとは別に「月足重視」「需給重視」「日足・出来高重視」「財務重視」の挑戦者を同時に計算し、週次コホートで比較します。各挑戦者自身についてTop20の結果が全件そろった5営業日後の検証20週・20営業日後の検証12週がたまるまでは、正式な見直し候補にしません。</p>\n',
              'learn challenger maturity',
          )
          replace_once(
              path,
              '      <p class="learn-note">この仕組みは「過去によく当たった条件へ合わせ続ける」ためではなく、条件変更が本当に再現性を改善したかを確認するためのものです。5営業日後・20営業日後の結果は、期間中の株式分割・併合を補正してから変更しない台帳へ固定します。ここでいう成績は分割・併合を補正した価格リターンで、配当再投資込みのトータルリターンではありません。スコア仕様を変える場合はengine versionを分け、異なる版の履歴を混ぜません。</p>\n',
              '      <p class="learn-note">この仕組みは「過去によく当たった条件へ合わせ続ける」ためではなく、条件変更が本当に再現性を改善したかを確認するためのものです。snapshotには実際に生成した時刻も保存し、後から届いた信用需給を古い株価日の判断材料だったことにはしません。5営業日後・20営業日後の結果は、期間中の株式分割・併合を補正してから変更しない台帳へ固定し、観測済みの分割・併合イベント自体も別に保持するため、銘柄が後で対象外になっても補正を失いにくくしています。ここでいう成績は分割・併合を補正した価格リターンで、配当再投資込みのトータルリターンではありません。スコア仕様を変える場合はengine versionを分け、異なる版の履歴を混ぜません。</p>\n',
              'learn availability and split archive',
          )

          # 5) Production workflow must verify that the retained split ledger is produced.
          path = Path('.github/workflows/update-premium-research.yml')
          replace_once(
              path,
              "          if not engine_dir.exists():\n              raise SystemExit(f'engine-version history directory missing: {engine_dir}')\n          print('research snapshots', research.get('snapshot_count'), 'days', research.get('snapshot_day_count'), 'mature', research.get('mature_cohorts'))\n",
              "          if not engine_dir.exists():\n              raise SystemExit(f'engine-version history directory missing: {engine_dir}')\n          split_archive = Path('data/premium/research/split-events') / f\"{research['engine_version']}.json\"\n          if not split_archive.exists():\n              raise SystemExit(f'split-event archive missing: {split_archive}')\n          print('research snapshots', research.get('snapshot_count'), 'days', research.get('snapshot_day_count'), 'mature', research.get('mature_cohorts'))\n",
              'workflow split archive validation',
          )
          PY

          python -m py_compile scripts/build_premium_lab.py scripts/premium_research.py tests/test_premium_lab.py tests/test_premium_research.py
          python -m unittest tests.test_premium_lab tests.test_premium_research tests.test_logic -v
          git diff --check
      - name: Commit and push PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md learn.html scripts/build_premium_lab.py scripts/premium_research.py tests/test_premium_research.py .github/workflows/update-premium-research.yml
          git commit -m 'fix: prevent premium research lookahead and retain split events'
          git push origin HEAD:feature/watchlist-premium-research
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 77 --repo "$GITHUB_REPOSITORY" --body 'PR77 final review fixes applied: real recording timestamps prevent backdated cohorts, split events are retained across shard removal, and challenger readiness now uses each challenger’s own complete cohorts. Targeted tests passed.'
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 77 --repo "$GITHUB_REPOSITORY" --body 'PR77 final review patch failed in Actions; inspect the temporary workflow run before merging.'
