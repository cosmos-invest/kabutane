<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">損切り価格を決める画面</title>
  <desc id="desc">損切りの根拠を選び、チャートで価格を置き、損失金額を確認する操作を番号付きで説明した図</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1f7"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d95f98"/><stop offset="1" stop-color="#8f69cc"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#70485e" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="64" y="72" font-family="sans-serif" font-size="42" font-weight="800" fill="#593f4f">② 損切り価格を先に決める</text>
  <text x="64" y="118" font-family="sans-serif" font-size="23" fill="#826a79">買ってから考えず、「この予想が外れた」と判断する場所を最初に決めます。</text>

  <g filter="url(#shadow)">
    <rect x="84" y="166" width="535" height="640" rx="28" fill="#fff" stroke="#e5cad9" stroke-width="3"/>
    <text x="118" y="216" font-family="sans-serif" font-size="16" font-weight="900" fill="#c45185">STEP 2</text>
    <text x="118" y="258" font-family="sans-serif" font-size="31" font-weight="900" fill="#573f4e">3つの順番で決めよう</text>
    <text x="118" y="294" font-family="sans-serif" font-size="18" fill="#826a78">根拠を言葉にしてから、チャートで置き、</text>
    <text x="118" y="321" font-family="sans-serif" font-size="18" fill="#826a78">最後に損失金額を確認します。</text>

    <text x="118" y="365" font-family="sans-serif" font-size="16" font-weight="800" fill="#674e5e">① 根拠を1つ選ぶ</text>
    <rect x="118" y="382" width="280" height="62" rx="13" fill="#fff" stroke="#ddc5d4" stroke-width="2"/>
    <text x="140" y="422" font-family="sans-serif" font-size="21" font-weight="800" fill="#5a4050">直近安値</text>
    <rect x="413" y="382" width="172" height="62" rx="13" fill="#fff" stroke="#ddc5d4" stroke-width="2"/>
    <text x="499" y="421" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="800" fill="#765a6a">② チャートで置く</text>

    <rect x="118" y="475" width="25" height="25" rx="4" fill="#d95f98"/>
    <path d="M124 488 l6 6 l10 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="155" y="495" font-family="sans-serif" font-size="18" font-weight="800" fill="#674e5e">根拠：直近安値を割れたら崩れる</text>

    <rect x="118" y="523" width="467" height="92" rx="15" fill="#eef9f3"/>
    <text x="140" y="557" font-family="sans-serif" font-size="17" font-weight="900" fill="#557261">③ 金額を確認</text>
    <text x="140" y="585" font-family="sans-serif" font-size="17" fill="#557261">1株の損失 221円 ／ 損失上限 30,000円</text>

    <rect x="118" y="642" width="467" height="88" rx="15" fill="#f5efff"/>
    <text x="140" y="675" font-family="sans-serif" font-size="17" font-weight="900" fill="#79569c">エール💜</text>
    <text x="235" y="675" font-family="sans-serif" font-size="16" fill="#66505e">近すぎると小さな揺れで損切りになりやすいよ。</text>
    <text x="140" y="705" font-family="sans-serif" font-size="16" fill="#66505e">遠すぎると買える株数が少なくなるよ。</text>

    <rect x="348" y="749" width="237" height="58" rx="14" fill="url(#main)"/>
    <text x="466" y="786" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#fff">根拠と金額を確認して進む</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="166" width="650" height="640" rx="28" fill="#fff" stroke="#e5cad9" stroke-width="3"/>
    <text x="708" y="216" font-family="sans-serif" font-size="27" font-weight="900" fill="#573f4e">チャートを見て選ぶ</text>
    <text x="708" y="250" font-family="sans-serif" font-size="17" fill="#826a78">パネルを閉じて、直近のローソク足を全面表示します。</text>
    <rect x="708" y="278" width="584" height="475" rx="16" fill="#fff" stroke="#ead6e2"/>
    <g stroke="#eee4ea" stroke-width="1"><line x1="735" y1="345" x2="1265" y2="345"/><line x1="735" y1="430" x2="1265" y2="430"/><line x1="735" y1="515" x2="1265" y2="515"/><line x1="735" y1="600" x2="1265" y2="600"/><line x1="735" y1="685" x2="1265" y2="685"/></g>
    <path d="M740 616 C810 585 875 610 935 567 S1040 565 1110 518 S1195 506 1260 480" fill="none" stroke="#d95f98" stroke-width="4"/>
    <path d="M740 654 C850 645 955 630 1050 604 S1170 580 1260 560" fill="none" stroke="#5c9fc5" stroke-width="4"/>
    <g stroke="#7d6a76" stroke-width="2">
      <line x1="780" y1="548" x2="780" y2="620"/><rect x="773" y="570" width="14" height="31" fill="#59a4bb"/>
      <line x1="830" y1="526" x2="830" y2="595"/><rect x="823" y="548" width="14" height="28" fill="#d95f98"/>
      <line x1="880" y1="540" x2="880" y2="608"/><rect x="873" y="560" width="14" height="30" fill="#59a4bb"/>
      <line x1="930" y1="510" x2="930" y2="579"/><rect x="923" y="530" width="14" height="31" fill="#d95f98"/>
      <line x1="980" y1="495" x2="980" y2="563"/><rect x="973" y="516" width="14" height="29" fill="#d95f98"/>
      <line x1="1030" y1="480" x2="1030" y2="548"/><rect x="1023" y="500" width="14" height="30" fill="#59a4bb"/>
      <line x1="1080" y1="455" x2="1080" y2="525"/><rect x="1073" y="477" width="14" height="30" fill="#d95f98"/>
      <line x1="1130" y1="430" x2="1130" y2="500"/><rect x="1123" y="452" width="14" height="29" fill="#d95f98"/>
      <line x1="1180" y1="445" x2="1180" y2="515"/><rect x="1173" y="465" width="14" height="31" fill="#59a4bb"/>
      <line x1="1230" y1="418" x2="1230" y2="488"/><rect x="1223" y="439" width="14" height="31" fill="#d95f98"/>
    </g>
    <line x1="730" y1="616" x2="1270" y2="616" stroke="#347fa8" stroke-width="5" stroke-dasharray="11 7"/>
    <rect x="1113" y="585" width="145" height="47" rx="12" fill="#347fa8"/>
    <text x="1186" y="616" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#fff">SL 4,023円</text>
    <circle cx="880" cy="616" r="18" fill="#fff" stroke="#347fa8" stroke-width="6"/>
    <text x="1000" y="784" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#7a6270">チャートをタップすると、その価格が損切り候補になるよ。</text>
  </g>

  <g font-family="sans-serif">
    <circle cx="89" cy="394" r="25" fill="#d95f98"/><text x="89" y="402" text-anchor="middle" font-size="23" font-weight="900" fill="#fff">1</text>
    <circle cx="88" cy="488" r="25" fill="#69a47c"/><text x="88" y="496" text-anchor="middle" font-size="23" font-weight="900" fill="#fff">2</text>
    <circle cx="1290" cy="303" r="25" fill="#4b91b4"/><text x="1290" y="311" text-anchor="middle" font-size="23" font-weight="900" fill="#fff">3</text>
  </g>

  <rect x="65" y="833" width="1270" height="48" rx="16" fill="#f6efff"/>
  <text x="92" y="865" font-family="sans-serif" font-size="21" font-weight="800" fill="#76569a">エール：</text>
  <text x="183" y="865" font-family="sans-serif" font-size="20" fill="#624e5a">損切りは「負けを認める場所」じゃなくて、資金を守って次へ進むための場所だよ。</text>
</svg>
